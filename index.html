<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Bancario</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Simulador">
    <link rel="apple-touch-icon" href="src/Simulador-icon.png">
    <link rel="icon" type="image/png" href="src/Simulador-icon.png">

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #0052cc;
            --primary-dark: #003e99;
            --primary-light: #e8f0fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .header-icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-titles h1 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 800;
            line-height: 1.2;
        }

        .header-titles p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Selector de Modo */
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 4px;
        }

        .selector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-mode {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .btn-mode .btn-icon-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: grayscale(20%) opacity(0.8);
        }

        .btn-mode span {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-mode.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-mode.active .btn-icon-img {
            filter: brightness(0) invert(1);
        }

        .btn-mode.active span {
            color: #ffffff;
        }

        /* Tarjeta de Entrada */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .input-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 12px 40px 12px 14px;
            font-size: 1.4rem;
            font-weight: 800;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            color: var(--text-main);
            background: #f8fafc;
        }

        .input-field:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .input-icon-img {
            position: absolute;
            right: 14px;
            width: 22px;
            height: 22px;
            object-fit: contain;
            opacity: 0.6;
        }

        .info-text {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 10px;
            line-height: 1.3;
        }

        .info-icon-img {
            width: 16px;
            height: 16px;
            object-fit: contain;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* Resultados estilo Banco */
        .results-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .bank-banner {
            background: linear-gradient(135deg, #004481 0%, #1464a5 100%);
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bank-logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .bank-subtitle {
            font-size: 0.75rem;
            opacity: 0.85;
            text-transform: uppercase;
            font-weight: 600;
        }

        .results-columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 16px 10px;
            text-align: center;
            gap: 4px;
        }

        .res-col {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 4px;
        }

        .res-col:not(:last-child) {
            border-right: 1px solid var(--border-color);
        }

        .res-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.2;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .res-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
            word-break: break-word;
        }

        .res-val.highlight {
            color: var(--primary);
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Encabezado -->
    <div class="header">
        <div class="header-icon">
            <img src="src/casa.png" alt="Casa" class="header-icon-img">
        </div>
        <div class="header-titles">
            <h1>Simulador Bancario</h1>
            <p>Captura solo uno de los datos</p>
        </div>
    </div>

    <!-- Modos de Captura -->
    <div class="section-title">Capturar por:</div>
    <div class="selector-grid">
        <button class="btn-mode active" id="btn-valor" onclick="setMode('VALOR')">
            <img src="src/valor.png" alt="Valor" class="btn-icon-img">
            <span>Valor</span>
        </button>
        <button class="btn-mode" id="btn-ingreso" onclick="setMode('INGRESO')">
            <img src="src/ingreso.png" alt="Ingreso" class="btn-icon-img">
            <span>Ingreso</span>
        </button>
        <button class="btn-mode" id="btn-mensualidad" onclick="setMode('MENSUALIDAD')">
            <img src="src/mensualidad.png" alt="Mensualidad" class="btn-icon-img">
            <span>Mensualidad</span>
        </button>
    </div>

    <!-- Entrada de datos -->
    <div class="card">
        <label class="input-label" id="input-label">Valor del departamento</label>
        <div class="input-wrapper">
            <input
                type="text"
                id="amount-input"
                class="input-field"
                inputmode="numeric"
                placeholder="$0"
                oninput="handleInput(this)"
            >
            <img src="src/valor.png" alt="Icono" class="input-icon-img" id="input-icon">
        </div>
        <div class="info-text">
            <img src="src/informacion.png" class="info-icon-img">
            <span>Solo se captura uno: valor, ingreso o mensualidad.</span>
        </div>
    </div>

    <!-- Resultados estilo Banco -->
    <div class="section-title">Resultados de tu simulación</div>
    <div class="results-card">
        <div class="bank-banner">
           <!-- <div class="bank-logo">BBVA</div>-->
            <div class="bank-subtitle">Escenario Estimado</div>
        </div>
        <div class="results-columns">
            <div class="res-col">
                <span class="res-label">Valor del dpto.</span>
                <span class="res-val highlight" id="val-s1-m1">$0</span>
            </div>
            <div class="res-col">
                <span class="res-label">Ingreso mensual</span>
                <span class="res-val" id="val-s1-m2">$0</span>
            </div>
            <div class="res-col">
                <span class="res-label">Mensualidad</span>
                <span class="res-val" id="val-s1-m3">$0</span>
            </div>
        </div>
    </div>
</div>

<script>
    const FACTOR_INGRESO = 0.0181872;
    const FACTOR_MENSUALIDAD = 0.0095724;

    let currentMode = 'VALOR';

    const labels = {
        VALOR: 'Valor del departamento',
        INGRESO: 'Ingreso mensual del cliente',
        MENSUALIDAD: 'Mensualidad estimada'
    };

    const iconSources = {
        VALOR: 'src/valor.png',
        INGRESO: 'src/ingreso.png',
        MENSUALIDAD: 'src/mensualidad.png'
    };

    function setMode(mode) {
        currentMode = mode;

        document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${mode.toLowerCase()}`).classList.add('active');

        document.getElementById('input-label').innerText = labels[mode];
        document.getElementById('input-icon').src = iconSources[mode];

        calculate();
    }

    function formatNumber(val) {
        if (!val && val !== 0) return '0';
        return Math.round(val).toLocaleString('es-MX');
    }

    function parseFormattedNumber(str) {
        return parseFloat(str.replace(/[^0-9]/g, '')) || 0;
    }

    function handleInput(input) {
        let rawValue = input.value.replace(/[^0-9]/g, '');
        if (rawValue) {
            let num = parseInt(rawValue, 10);
            input.value = '$' + num.toLocaleString('es-MX');
        } else {
            input.value = '';
        }
        calculate();
    }

    function calculate() {
        const inputElement = document.getElementById('amount-input');
        const rawAmount = parseFormattedNumber(inputElement.value);

        let valor = 0;
        let ingreso = 0;
        let mensualidad = 0;

        if (rawAmount > 0) {
            if (currentMode === 'VALOR') {
                valor = rawAmount;
                ingreso = valor * FACTOR_INGRESO;
                mensualidad = valor * FACTOR_MENSUALIDAD;
            } else if (currentMode === 'INGRESO') {
                ingreso = rawAmount;
                valor = ingreso / FACTOR_INGRESO;
                mensualidad = valor * FACTOR_MENSUALIDAD;
            } else if (currentMode === 'MENSUALIDAD') {
                mensualidad = rawAmount;
                valor = mensualidad / FACTOR_MENSUALIDAD;
                ingreso = valor * FACTOR_INGRESO;
            }
        }

        const elValor = document.getElementById('val-s1-m1');
        const elIngreso = document.getElementById('val-s1-m2');
        const elMensualidad = document.getElementById('val-s1-m3');

        elValor.innerText = '$' + formatNumber(valor);
        elIngreso.innerText = '$' + formatNumber(ingreso);
        elMensualidad.innerText = '$' + formatNumber(mensualidad);

        // Limpiar resaltado
        elValor.classList.remove('highlight');
        elIngreso.classList.remove('highlight');
        elMensualidad.classList.remove('highlight');

        // Resaltar en azul únicamente el valor ingresado
        if (currentMode === 'VALOR') {
            elValor.classList.add('highlight');
        } else if (currentMode === 'INGRESO') {
            elIngreso.classList.add('highlight');
        } else if (currentMode === 'MENSUALIDAD') {
            elMensualidad.classList.add('highlight');
        }
    }

    // Registro de Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.error('Error SW:', err));
        });
    }
</script>

</body>
</html>
